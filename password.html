<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password generator — Ethan</title><meta name="description" content="Generate strong, private passwords locally in your browser.">
  <link rel="canonical" href="https://agenticspark.github.io/password.html"><link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="./assets/css/site.css">
</head><body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="inner"><a href="./" class="brand">Ethan</a><nav class="nav" aria-label="Primary"><a href="./blog.html">Blog</a><a href="./careers/top-200-companies.html">Careers</a><a href="./password.html">Tools</a><a href="./about.html">About</a></nav></div></header>
  <main id="main" class="container"><header class="page-heading"><span class="eyebrow">Browser utility</span><h1>Password generator</h1><p>Create a strong password with cryptographically secure randomness. Everything happens on this device—nothing is stored or sent.</p></header>
    <section class="tool-shell" aria-labelledby="generator-title"><h2 id="generator-title" class="visually-hidden">Generate a password</h2>
      <form class="card password-panel" data-password-generator>
        <div class="password-output-row"><label class="visually-hidden" for="password-output">Generated password</label><input id="password-output" class="password-output" data-password-output readonly spellcheck="false" autocomplete="off"><button class="btn btn-ghost" type="button" data-copy-password>Copy password</button></div>
        <label class="range-label" for="password-length"><span>Password length</span><output data-length-value for="password-length">20</output></label><input id="password-length" name="length" type="range" min="8" max="128" value="20">
        <fieldset class="control-group"><legend>Character types</legend><div class="check-grid">
          <label class="check-option"><input type="checkbox" name="characters" value="lowercase" checked> Lowercase</label><label class="check-option"><input type="checkbox" name="characters" value="uppercase" checked> Uppercase</label><label class="check-option"><input type="checkbox" name="characters" value="numbers" checked> Numbers</label><label class="check-option"><input type="checkbox" name="characters" value="symbols" checked> Symbols</label>
        </div></fieldset><button class="btn btn-primary" type="submit">Generate new password</button><p class="tool-note" data-password-status role="status" aria-live="polite"></p>
      </form>
    </section>
  </main><footer class="site-footer"><div class="inner"><span>© 2026 Ethan</span><span>built static · no framework</span><a href="https://github.com/AgenticSpark">github →</a></div></footer><script src="./assets/js/site.js"></script>
</body></html>
